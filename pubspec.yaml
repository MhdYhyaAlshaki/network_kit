name: network_kit
description: Reusable Flutter network toolkit with Dio factory, interceptors, connectivity, and request cancellation.
version: 1.0.0+1
repository: https://github.com/MhdYhyaAlshaki/network_kit.git
# publish_to: 'none'

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  connectivity_plus: ^7.1.1
  pretty_dio_logger: ^1.4.0
  package_info_plus: ^10.1.0
  multiple_result: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
